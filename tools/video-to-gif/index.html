<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video to GIF | Free, Private, Client-Side</title>
  <meta name="description" content="Convert any video to a GIF for free. Choose start time, duration, and size. All processing happens in your browser.">
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>

<div class="container">
  <div class="tool-page">
    <a href="../../" class="back-link">← Back to Tools</a>
    <h1>Video to GIF</h1>
    <p class="subtitle">Convert video clips to GIFs. Everything happens in your browser.</p>

    <div class="tool-area">
      <div class="upload-zone" id="dropZone">
        <div class="big-icon">📁</div>
        <strong>Drop a video here</strong>
        <p>or click to browse (MP4, WebM, MOV)</p>
        <input type="file" id="fileInput" accept="video/*">
      </div>

      <div class="preview-area" id="previewArea">
        <video id="videoPreview" controls style="max-width:100%;border-radius:8px"></video>
        <div id="fileInfo" style="color:var(--text2);margin:12px 0;font-size:.9rem"></div>
      </div>

      <div class="controls" id="controls">
        <label>Start time (seconds)</label>
        <input type="number" id="startTime" value="0" min="0" step="0.1" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:8px;margin-bottom:16px">

        <label>Duration (seconds, max 10)</label>
        <input type="number" id="duration" value="3" min="0.5" max="10" step="0.1" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:8px;margin-bottom:16px">

        <label>Width (pixels)</label>
        <select id="width">
          <option value="320">320px</option>
          <option value="480" selected>480px</option>
          <option value="640">640px</option>
        </select>

        <label>Frame rate (fps)</label>
        <select id="fps">
          <option value="8">8 fps (small file)</option>
          <option value="12" selected>12 fps (balanced)</option>
          <option value="15">15 fps (smooth)</option>
        </select>
      </div>

      <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
      <div class="status" id="status"></div>

      <div class="action-row" id="actionRow" style="display:none">
        <button class="btn" id="convertBtn">Convert to GIF</button>
        <button class="btn btn-secondary" id="resetBtn">Reset</button>
      </div>
    </div>
  </div>
</div>

<script src="../../assets/tools.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
<script>
(function(){
  var dropZone = document.getElementById('dropZone');
  var fileInput = document.getElementById('fileInput');
  var previewArea = document.getElementById('previewArea');
  var videoPreview = document.getElementById('videoPreview');
  var controls = document.getElementById('controls');
  var actionRow = document.getElementById('actionRow');
  var convertBtn = document.getElementById('convertBtn');
  var resetBtn = document.getElementById('resetBtn');
  var statusEl = document.getElementById('status');
  var fileInfo = document.getElementById('fileInfo');
  var progressBar = document.getElementById('progressBar');
  var progressFill = document.getElementById('progressFill');

  var currentFile = null;

  Tools.setupDropZone(dropZone, handleFile);
  fileInput.addEventListener('change', function(e) { if (e.target.files[0]) handleFile(e.target.files[0]); });

  function handleFile(file) {
    currentFile = file;
    videoPreview.src = URL.createObjectURL(file);
    previewArea.style.display = 'block';
    controls.style.display = 'block';
    actionRow.style.display = 'flex';
    dropZone.style.display = 'none';
    statusEl.style.display = 'none';
    progressBar.style.display = 'none';
    fileInfo.textContent = 'File: ' + file.name + ' (' + Tools.formatSize(file.size) + ')';
  }

  resetBtn.addEventListener('click', function() {
    currentFile = null;
    dropZone.style.display = 'block';
    previewArea.style.display = 'none';
    controls.style.display = 'none';
    actionRow.style.display = 'none';
    statusEl.style.display = 'none';
    progressBar.style.display = 'none';
    videoPreview.src = '';
    fileInput.value = '';
  });

  function seekVideo(video, time) {
    return new Promise(function(resolve) {
      function onSeeked() {
        video.removeEventListener('seeked', onSeeked);
        resolve();
      }
      video.addEventListener('seeked', onSeeked);
      video.currentTime = time;
    });
  }

  convertBtn.addEventListener('click', async function() {
    if (!currentFile) return;
    if (typeof GIF === 'undefined') {
      Tools.setStatus(statusEl, 'Error: GIF encoder not loaded. Check your internet connection.', 'error');
      return;
    }
    convertBtn.disabled = true;
    progressBar.style.display = 'block';
    Tools.setStatus(statusEl, 'Loading video...', '');
    progressFill.style.width = '5%';

    try {
      var video = document.createElement('video');
      video.muted = true;
      video.preload = 'auto';
      video.src = videoPreview.src;

      await new Promise(function(resolve, reject) {
        video.onloadeddata = resolve;
        video.onerror = reject;
      });

      var startTime = parseFloat(document.getElementById('startTime').value) || 0;
      var duration = Math.min(parseFloat(document.getElementById('duration').value) || 3, 10);
      var targetWidth = parseInt(document.getElementById('width').value);
      var fps = parseInt(document.getElementById('fps').value);
      var scale = targetWidth / video.videoWidth;
      var targetHeight = Math.round(video.videoHeight * scale);

      var canvas = document.createElement('canvas');
      canvas.width = targetWidth;
      canvas.height = targetHeight;
      var ctx = canvas.getContext('2d');

      var gif = new GIF({
        workers: 2,
        quality: 10,
        width: targetWidth,
        height: targetHeight,
        workerScript: 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js'
      });

      gif.on('progress', function(p) {
        var pct = Math.floor(p * 100);
        progressFill.style.width = (50 + pct * 0.5) + '%';
        Tools.setStatus(statusEl, 'Encoding GIF... ' + pct + '%', '');
      });

      gif.on('finished', function(blob) {
        var name = currentFile.name.replace(/\.[^.]+$/, '.gif');
        Tools.downloadBlob(blob, name);
        Tools.setStatus(statusEl, 'Done! GIF size: ' + Tools.formatSize(blob.size), 'done');
        progressFill.style.width = '100%';
        convertBtn.disabled = false;
      });

      await seekVideo(video, startTime);

      var totalFrames = Math.ceil(duration * fps);
      var frameInterval = 1 / fps;
      var frame = 0;

      Tools.setStatus(statusEl, 'Capturing frames...', '');

      async function captureFrame() {
        if (frame >= totalFrames || video.currentTime >= startTime + duration) {
          Tools.setStatus(statusEl, 'Captured ' + frame + ' frames. Encoding GIF...', '');
          progressFill.style.width = '50%';
          gif.render();
          return;
        }

        ctx.drawImage(video, 0, 0, targetWidth, targetHeight);
        gif.addFrame(ctx, { copy: true, delay: 1000 / fps });

        frame++;
        var pct = Math.floor((frame / totalFrames) * 45);
        progressFill.style.width = pct + '%';

        var nextTime = video.currentTime + frameInterval;
        if (nextTime >= startTime + duration) {
          Tools.setStatus(statusEl, 'Captured ' + frame + ' frames. Encoding GIF...', '');
          progressFill.style.width = '50%';
          gif.render();
          return;
        }
        await seekVideo(video, nextTime);
        requestAnimationFrame(captureFrame);
      }

      captureFrame();
    } catch(err) {
      Tools.setStatus(statusEl, 'Error: ' + err.message, 'error');
      convertBtn.disabled = false;
    }
  });
})();
</script>

</body>
</html>
