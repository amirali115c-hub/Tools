<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Splitter | Free, Private, Client-Side</title>
  <meta name="description" content="Split PDF into separate pages or ranges. Free, private, runs in your browser.">
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<div class="container">
  <div class="tool-page">
    <a href="../../" class="back-link">← Back to Tools</a>
    <h1>PDF Splitter</h1>
    <p class="subtitle">Split PDF into pages or ranges. No uploads.</p>
    <div class="tool-area">
      <div class="upload-zone" id="dropZone">
        <div class="big-icon">📁</div>
        <strong>Drop a PDF here</strong>
        <p>or click to browse</p>
        <input type="file" id="fileInput" accept=".pdf,application/pdf">
      </div>
      <div class="preview-area" id="previewArea">
        <div id="fileInfo" style="color:var(--text2);margin-bottom:12px;font-size:.9rem"></div>
        <div id="pagePreviews" style="display:flex;flex-wrap:wrap;gap:8px"></div>
      </div>
      <div class="controls" id="controls">
        <label>Page Ranges (e.g. 1-3, 5, 7-10)</label>
        <input type="text" id="ranges" placeholder="1-3, 5, 7-10" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:8px;margin-bottom:16px">
        <p style="color:var(--text2);font-size:.85rem">Leave empty to extract all pages separately.</p>
      </div>
      <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
      <div class="status" id="status"></div>
      <div class="action-row" id="actionRow" style="display:none">
        <button class="btn" id="splitBtn">Split PDF</button>
        <button class="btn btn-secondary" id="resetBtn">Reset</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../../assets/tools.js"></script>
<script>
(function(){
  if(typeof pdfjsLib==='undefined'||typeof jspdf==='undefined'){Tools.setStatus(document.getElementById('status'),'Error: Libraries not loaded.','error');return;}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput'),previewArea=document.getElementById('previewArea'),pagePreviews=document.getElementById('pagePreviews'),controls=document.getElementById('controls'),actionRow=document.getElementById('actionRow'),splitBtn=document.getElementById('splitBtn'),resetBtn=document.getElementById('resetBtn'),statusEl=document.getElementById('status'),fileInfo=document.getElementById('fileInfo'),progressBar=document.getElementById('progressBar'),progressFill=document.getElementById('progressFill');
  var currentFile=null,pdfDoc=null;
  Tools.setupDropZone(dropZone,handleFile);
  fileInput.addEventListener('change',function(e){if(e.target.files[0])handleFile(e.target.files[0]);});
  async function handleFile(file){
    currentFile=file;dropZone.style.display='none';previewArea.style.display='block';controls.style.display='block';
    actionRow.style.display='flex';statusEl.style.display='none';progressBar.style.display='none';
    fileInfo.textContent='File: '+file.name+' ('+Tools.formatSize(file.size)+')';
    Tools.setStatus(statusEl,'Loading PDF...','');
    try{var data=await Tools.readAsArrayBuffer(file);pdfDoc=await pdfjsLib.getDocument({data:data}).promise;
    pagePreviews.innerHTML='';var limit=Math.min(pdfDoc.numPages,8);
    for(var i=1;i<=limit;i++){var page=await pdfDoc.getPage(i);var vp=page.getViewport({scale:0.25});var c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.style.borderRadius='4px';c.style.border='1px solid var(--border)';await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;pagePreviews.appendChild(c);}
    if(pdfDoc.numPages>limit){var m=document.createElement('div');m.style.cssText='display:flex;align-items:center;color:var(--text2);font-size:.85rem';m.textContent='+'+(pdfDoc.numPages-limit)+' more';pagePreviews.appendChild(m);}
    Tools.setStatus(statusEl,pdfDoc.numPages+' pages loaded.','done');}catch(err){Tools.setStatus(statusEl,'Error: '+err.message,'error');}
  }
  resetBtn.addEventListener('click',function(){currentFile=null;pdfDoc=null;dropZone.style.display='block';previewArea.style.display='none';controls.style.display='none';actionRow.style.display='none';statusEl.style.display='none';progressBar.style.display='none';fileInput.value='';});
  function parseRanges(str,total){
    if(!str.trim())return Array.from({length:total},function(_,i){return[i+1];});
    var pages=[];str.split(',').forEach(function(part){
      part=part.trim();if(part.indexOf('-')!==-1){var parts=part.split('-');var s=parseInt(parts[0]),e=parseInt(parts[1]);for(var i=s;i<=e&&i<=total;i++)if(i>0)pages.push(i);}
      else{var n=parseInt(part);if(n>0&&n<=total)pages.push(n);}
    });return pages;
  }
  splitBtn.addEventListener('click',async function(){
    if(!pdfDoc)return;splitBtn.disabled=true;progressBar.style.display='block';
    Tools.setStatus(statusEl,'Splitting...','');
    try{
      var pages=parseRanges(document.getElementById('ranges').value,pdfDoc.numPages);
      if(pages.length===0){Tools.setStatus(statusEl,'No valid pages specified.','error');splitBtn.disabled=false;return;}
      var {jsPDF}=jspdf;
      for(var i=0;i<pages.length;i++){
        var pageNum=pages[i];var page=await pdfDoc.getPage(pageNum);
        var viewport=page.getViewport({scale:2});
        var c=document.createElement('canvas');c.width=viewport.width;c.height=viewport.height;
        await page.render({canvasContext:c.getContext('2d'),viewport:viewport}).promise;
        var imgData=c.toDataURL('image/jpeg',0.95);
        var doc=new jsPDF({orientation:viewport.width>viewport.height?'landscape':'portrait',unit:'pt',format:[viewport.width/2,viewport.height/2]});
        doc.addImage(imgData,'JPEG',0,0,doc.internal.pageSize.getWidth(),doc.internal.pageSize.getHeight());
        doc.save('page_'+pageNum+'.pdf');
        var pct=Math.floor(((i+1)/pages.length)*100);progressFill.style.width=pct+'%';
        Tools.setStatus(statusEl,'Extracted page '+pageNum+'...','');
      }
      Tools.setStatus(statusEl,'Done! '+pages.length+' pages extracted.','done');
    }catch(err){Tools.setStatus(statusEl,'Error: '+err.message,'error');}
    splitBtn.disabled=false;
  });
})();
</script>
</body>
</html>
