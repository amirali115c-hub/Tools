<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Compressor | Free, Private, Client-Side</title>
  <meta name="description" content="Compress video files for free without losing quality. Reduces file size in your browser. No uploads, no tracking.">
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>

<div class="container">
  <div class="tool-page">
    <a href="../../" class="back-link">← Back to Tools</a>
    <h1>Video Compressor</h1>
    <p class="subtitle">Compress videos in your browser. No server. No uploads.</p>

    <div class="tool-area">
      <div class="upload-zone" id="dropZone">
        <div class="big-icon">📁</div>
        <strong>Drop a video here</strong>
        <p>or click to browse (MP4, WebM, MOV)</p>
        <input type="file" id="fileInput" accept="video/*">
      </div>

      <div class="preview-area" id="previewArea">
        <video id="videoPreview" controls style="max-width:100%;border-radius:8px"></video>
        <div id="fileInfo" style="color:var(--text2);margin:12px 0;font-size:.9rem"></div>
      </div>

      <div class="controls" id="controls">
        <label>Quality (bitrate)</label>
        <select id="quality">
          <option value="1000000">Low (1 Mbps) - smallest file</option>
          <option value="2500000" selected>Medium (2.5 Mbps) - balanced</option>
          <option value="5000000">High (5 Mbps) - best quality</option>
        </select>

        <label>Resolution</label>
        <select id="resolution">
          <option value="0">Keep original</option>
          <option value="360">360p</option>
          <option value="480">480p</option>
          <option value="720">720p</option>
        </select>

        <label>FPS</label>
        <select id="fps">
          <option value="0">Keep original</option>
          <option value="24">24 fps</option>
          <option value="30" selected>30 fps</option>
        </select>
      </div>

      <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
      <div class="status" id="status"></div>

      <div class="action-row" id="actionRow" style="display:none">
        <button class="btn" id="compressBtn">Compress Video</button>
        <button class="btn btn-secondary" id="resetBtn">Reset</button>
      </div>
    </div>
  </div>
</div>

<script src="../../assets/tools.js"></script>
<script>
(function(){
  var dropZone = document.getElementById('dropZone');
  var fileInput = document.getElementById('fileInput');
  var previewArea = document.getElementById('previewArea');
  var videoPreview = document.getElementById('videoPreview');
  var controls = document.getElementById('controls');
  var actionRow = document.getElementById('actionRow');
  var compressBtn = document.getElementById('compressBtn');
  var resetBtn = document.getElementById('resetBtn');
  var statusEl = document.getElementById('status');
  var fileInfo = document.getElementById('fileInfo');
  var progressBar = document.getElementById('progressBar');
  var progressFill = document.getElementById('progressFill');
  var qualitySelect = document.getElementById('quality');
  var resolutionSelect = document.getElementById('resolution');
  var fpsSelect = document.getElementById('fps');

  var currentFile = null;

  Tools.setupDropZone(dropZone, handleFile);
  fileInput.addEventListener('change', function(e) { if (e.target.files[0]) handleFile(e.target.files[0]); });

  function handleFile(file) {
    currentFile = file;
    videoPreview.src = URL.createObjectURL(file);
    previewArea.style.display = 'block';
    controls.style.display = 'block';
    actionRow.style.display = 'flex';
    dropZone.style.display = 'none';
    statusEl.style.display = 'none';
    progressBar.style.display = 'none';
    fileInfo.textContent = 'File: ' + file.name + ' (' + Tools.formatSize(file.size) + ')';
  }

  resetBtn.addEventListener('click', function() {
    currentFile = null;
    dropZone.style.display = 'block';
    previewArea.style.display = 'none';
    controls.style.display = 'none';
    actionRow.style.display = 'none';
    statusEl.style.display = 'none';
    progressBar.style.display = 'none';
    videoPreview.src = '';
    fileInput.value = '';
  });

  function seekVideo(video, time) {
    return new Promise(function(resolve) {
      function onSeeked() {
        video.removeEventListener('seeked', onSeeked);
        resolve();
      }
      video.addEventListener('seeked', onSeeked);
      video.currentTime = time;
    });
  }

  compressBtn.addEventListener('click', async function() {
    if (!currentFile) return;
    compressBtn.disabled = true;
    progressBar.style.display = 'block';
    Tools.setStatus(statusEl, 'Loading video...', '');
    progressFill.style.width = '10%';

    try {
      var video = document.createElement('video');
      video.muted = true;
      video.preload = 'auto';
      video.src = videoPreview.src;

      await new Promise(function(resolve, reject) {
        video.onloadeddata = resolve;
        video.onerror = reject;
      });

      var targetBitrate = parseInt(qualitySelect.value);
      var targetFps = parseInt(fpsSelect.value) || 30;
      var targetHeight = parseInt(resolutionSelect.value) || video.videoHeight;
      var scale = targetHeight / video.videoHeight;
      var targetWidth = Math.round(video.videoWidth * scale);

      var offCanvas = document.createElement('canvas');
      offCanvas.width = targetWidth;
      offCanvas.height = targetHeight;
      var offCtx = offCanvas.getContext('2d');

      Tools.setStatus(statusEl, 'Compressing...', '');

      var stream = offCanvas.captureStream(targetFps);
      var mimeType = 'video/webm';
      if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
        mimeType = 'video/webm;codecs=vp9';
      } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) {
        mimeType = 'video/webm;codecs=vp8';
      }

      var chunks = [];
      var recorder = new MediaRecorder(stream, { mimeType: mimeType, videoBitsPerSecond: targetBitrate });
      recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = function() {
        var blob = new Blob(chunks, { type: 'video/webm' });
        var pctOriginal = Math.round((blob.size / currentFile.size) * 100);
        var name = currentFile.name.replace(/\.[^.]+$/, '_compressed.webm');
        Tools.downloadBlob(blob, name);
        Tools.setStatus(statusEl, 'Done! ' + Tools.formatSize(currentFile.size) + ' -> ' + Tools.formatSize(blob.size) + ' (' + pctOriginal + '% of original)', 'done');
        progressFill.style.width = '100%';
        compressBtn.disabled = false;
      };

      await seekVideo(video, 0);
      recorder.start();

      var frameInterval = 1 / targetFps;
      var duration = video.duration;
      var totalFrames = Math.ceil(duration * targetFps);
      var frame = 0;

      async function processFrame() {
        if (video.currentTime >= duration || frame >= totalFrames) {
          recorder.stop();
          return;
        }

        offCtx.drawImage(video, 0, 0, targetWidth, targetHeight);

        frame++;
        var pct = Math.floor((frame / totalFrames) * 85) + 10;
        progressFill.style.width = pct + '%';

        if (frame % 100 === 0) {
          Tools.setStatus(statusEl, 'Compressing... frame ' + frame + '/' + totalFrames, '');
        }

        var nextTime = video.currentTime + frameInterval;
        if (nextTime >= duration || frame >= totalFrames) {
          recorder.stop();
          return;
        }
        await seekVideo(video, nextTime);
        requestAnimationFrame(processFrame);
      }

      processFrame();
    } catch(err) {
      Tools.setStatus(statusEl, 'Error: ' + err.message, 'error');
      compressBtn.disabled = false;
    }
  });
})();
</script>

</body>
</html>
