<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watermark Remover | Free, Private, Client-Side</title>
  <meta name="description" content="Remove watermarks from videos and images for free. All processing happens in your browser. No uploads, no tracking.">
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>

<div class="container">
  <div class="tool-page">
    <a href="../../" class="back-link">← Back to Tools</a>
    <h1>Watermark Remover</h1>
    <p class="subtitle">Remove watermarks from videos and images. Everything stays in your browser.</p>

    <div class="tool-area">
      <div class="upload-zone" id="dropZone">
        <div class="big-icon">📁</div>
        <strong>Drop a video or image here</strong>
        <p>or click to browse (MP4, WebM, PNG, JPG, GIF)</p>
        <input type="file" id="fileInput" accept="video/*,image/*">
      </div>

      <div class="preview-area" id="previewArea">
        <video id="videoPreview" controls style="display:none;max-width:100%;border-radius:8px"></video>
        <img id="imagePreview" style="display:none;max-width:100%;border-radius:8px">
        <canvas id="canvas" style="display:none"></canvas>
      </div>

      <div class="controls" id="controls">
        <p style="color:var(--text2);margin-bottom:12px">Crops or blurs the watermark area from your media.</p>
        <label>Method</label>
        <select id="method">
          <option value="crop">Crop watermark from edge</option>
          <option value="blur">Blur watermark region</option>
        </select>
        <div id="blurControls" style="display:none">
          <label>Blur Strength</label>
          <input type="range" id="blurStrength" min="5" max="30" value="15">
        </div>
      </div>

      <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
      <div class="status" id="status"></div>

      <div class="action-row" id="actionRow" style="display:none">
        <button class="btn" id="removeBtn">Remove Watermark</button>
        <button class="btn btn-secondary" id="resetBtn">Reset</button>
      </div>
    </div>
  </div>
</div>

<script src="../../assets/tools.js"></script>
<script>
(function(){
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const previewArea = document.getElementById('previewArea');
  const videoPreview = document.getElementById('videoPreview');
  const imagePreview = document.getElementById('imagePreview');
  const controls = document.getElementById('controls');
  const actionRow = document.getElementById('actionRow');
  const removeBtn = document.getElementById('removeBtn');
  const resetBtn = document.getElementById('resetBtn');
  const statusEl = document.getElementById('status');
  const methodSelect = document.getElementById('method');
  const blurControls = document.getElementById('blurControls');
  const blurStrength = document.getElementById('blurStrength');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');

  let currentFile = null;
  let isVideo = false;

  Tools.setupDropZone(dropZone, handleFile);
  fileInput.addEventListener('change', function(e) {
    if (e.target.files[0]) handleFile(e.target.files[0]);
  });

  methodSelect.addEventListener('change', function() {
    blurControls.style.display = methodSelect.value === 'blur' ? 'block' : 'none';
  });

  function handleFile(file) {
    currentFile = file;
    isVideo = file.type.startsWith('video/');
    var url = URL.createObjectURL(file);

    if (isVideo) {
      videoPreview.src = url;
      videoPreview.style.display = 'block';
      imagePreview.style.display = 'none';
    } else {
      imagePreview.src = url;
      imagePreview.style.display = 'block';
      videoPreview.style.display = 'none';
    }

    previewArea.style.display = 'block';
    controls.style.display = 'block';
    actionRow.style.display = 'flex';
    dropZone.style.display = 'none';
    statusEl.style.display = 'none';
    progressBar.style.display = 'none';
  }

  resetBtn.addEventListener('click', function() {
    currentFile = null;
    dropZone.style.display = 'block';
    previewArea.style.display = 'none';
    controls.style.display = 'none';
    actionRow.style.display = 'none';
    statusEl.style.display = 'none';
    progressBar.style.display = 'none';
    videoPreview.src = '';
    imagePreview.src = '';
    fileInput.value = '';
  });

  removeBtn.addEventListener('click', function() {
    if (!currentFile) return;
    removeBtn.disabled = true;
    progressBar.style.display = 'block';

    if (isVideo) {
      processVideo();
    } else {
      processImage();
    }
  });

  function processImage() {
    Tools.setStatus(statusEl, 'Processing image...', '');
    var img = new Image();
    img.onload = function() {
      var c = document.createElement('canvas');
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      var ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);

      var method = methodSelect.value;
      if (method === 'crop') {
        var cropWidth = Math.floor(c.width * 0.85);
        var cropped = document.createElement('canvas');
        cropped.width = cropWidth;
        cropped.height = c.height;
        var cCtx = cropped.getContext('2d');
        cCtx.drawImage(c, 0, 0, cropWidth, c.height, 0, 0, cropWidth, c.height);
        cropped.toBlob(function(blob) {
          var name = currentFile.name.replace(/\.[^.]+$/, '_no_wm.png');
          Tools.downloadBlob(blob, name);
          Tools.setStatus(statusEl, 'Done. Image downloaded.', 'done');
          progressFill.style.width = '100%';
          removeBtn.disabled = false;
        }, 'image/png');
      } else {
        var strength = parseInt(blurStrength.value);
        var rightX = Math.floor(c.width * 0.85);
        var bottomY = Math.floor(c.height * 0.95);
        var imageData = ctx.getImageData(rightX, 0, c.width - rightX, c.height);
        var blurred = blurRegion(imageData, strength);
        ctx.putImageData(blurred, rightX, 0);
        var bottomData = ctx.getImageData(0, bottomY, c.width, c.height - bottomY);
        var blurredBottom = blurRegion(bottomData, strength);
        ctx.putImageData(blurredBottom, 0, bottomY);

        c.toBlob(function(blob) {
          var name = currentFile.name.replace(/\.[^.]+$/, '_no_wm.png');
          Tools.downloadBlob(blob, name);
          Tools.setStatus(statusEl, 'Done. Image downloaded.', 'done');
          progressFill.style.width = '100%';
          removeBtn.disabled = false;
        }, 'image/png');
      }
    };
    img.src = URL.createObjectURL(currentFile);
  }

  function blurRegion(imageData, strength) {
    var d = imageData.data;
    var w = imageData.width;
    var h = imageData.height;
    var out = new ImageData(w, h);
    var o = out.data;
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var r=0, g=0, b=0, count=0;
        for (var dy=-strength; dy<=strength; dy++) {
          for (var dx=-strength; dx<=strength; dx++) {
            var nx=x+dx, ny=y+dy;
            if (nx>=0 && nx<w && ny>=0 && ny<h) {
              var i=(ny*w+nx)*4;
              r+=d[i]; g+=d[i+1]; b+=d[i+2]; count++;
            }
          }
        }
        var i=(y*w+x)*4;
        o[i]=r/count; o[i+1]=g/count; o[i+2]=b/count; o[i+3]=d[i+3];
      }
    }
    return out;
  }

  function seekVideo(video, time) {
    return new Promise(function(resolve) {
      function onSeeked() {
        video.removeEventListener('seeked', onSeeked);
        resolve();
      }
      video.addEventListener('seeked', onSeeked);
      video.currentTime = time;
    });
  }

  async function processVideo() {
    Tools.setStatus(statusEl, 'Loading video...', '');
    progressFill.style.width = '10%';

    var video = document.createElement('video');
    video.muted = true;
    video.preload = 'auto';
    video.src = videoPreview.src;

    await new Promise(function(resolve, reject) {
      video.onloadeddata = resolve;
      video.onerror = reject;
    });

    var duration = video.duration;
    var method = methodSelect.value;
    var strength = parseInt(blurStrength.value);
    var offCanvas = document.createElement('canvas');
    offCanvas.width = video.videoWidth;
    offCanvas.height = video.videoHeight;
    var offCtx = offCanvas.getContext('2d');

    var stream = offCanvas.captureStream(30);
    var chunks = [];
    var mimeType = 'video/webm';
    if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
      mimeType = 'video/webm;codecs=vp9';
    } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) {
      mimeType = 'video/webm;codecs=vp8';
    }

    var recorder = new MediaRecorder(stream, { mimeType: mimeType, videoBitsPerSecond: 5000000 });
    recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = function() {
      var blob = new Blob(chunks, { type: 'video/webm' });
      var name = currentFile.name.replace(/\.[^.]+$/, '_no_wm.webm');
      Tools.downloadBlob(blob, name);
      Tools.setStatus(statusEl, 'Done. Video downloaded.', 'done');
      progressFill.style.width = '100%';
      removeBtn.disabled = false;
    };

    await seekVideo(video, 0);
    recorder.start();

    var frameInterval = 1/30;
    var framesProcessed = 0;
    var totalFrames = Math.ceil(duration * 30);

    async function processFrame() {
      if (video.currentTime >= duration) {
        recorder.stop();
        return;
      }

      offCtx.drawImage(video, 0, 0);

      if (method === 'crop') {
        var barWidth = Math.floor(offCanvas.width * 0.15);
        offCtx.fillStyle = '#000';
        offCtx.fillRect(offCanvas.width - barWidth, 0, barWidth, offCanvas.height);
      } else {
        try {
          var rightX = Math.floor(offCanvas.width * 0.85);
          var imgData = offCtx.getImageData(rightX, 0, offCanvas.width - rightX, offCanvas.height);
          var blurred = blurRegion(imgData, strength);
          offCtx.putImageData(blurred, rightX, 0);
        } catch(e) {}
      }

      framesProcessed++;
      var pct = Math.floor((framesProcessed / totalFrames) * 90);
      progressFill.style.width = pct + '%';
      if (framesProcessed % 30 === 0) {
        Tools.setStatus(statusEl, 'Processing frame ' + framesProcessed + '/' + totalFrames + '...', '');
      }

      var nextTime = video.currentTime + frameInterval;
      if (nextTime >= duration) {
        recorder.stop();
        return;
      }
      await seekVideo(video, nextTime);
      requestAnimationFrame(processFrame);
    }

    processFrame();
  }
})();
</script>

</body>
</html>
