<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Converter | Free, Private, Client-Side</title>
  <meta name="description" content="Convert images between PNG, JPG, WebP, GIF. Free, private, runs in your browser.">
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<div class="container">
  <div class="tool-page">
    <a href="../../" class="back-link">← Back to Tools</a>
    <h1>Image Converter</h1>
    <p class="subtitle">Convert between PNG, JPG, WebP, GIF. No uploads.</p>
    <div class="tool-area">
      <div class="upload-zone" id="dropZone">
        <div class="big-icon">📁</div>
        <strong>Drop an image here</strong>
        <p>or click to browse</p>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
      </div>

      <div id="previewArea" style="display:none">
        <img id="imagePreview" style="max-width:100%;border-radius:8px">
        <div id="fileInfo" style="color:var(--text2);margin:12px 0;font-size:.9rem"></div>
      </div>

      <div id="controls" style="display:none">
        <label>Output Format</label>
        <select id="format">
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPEG</option>
          <option value="image/webp">WebP</option>
        </select>
        <label>Quality (for JPEG/WebP)</label>
        <input type="range" id="quality" min="10" max="100" value="90">
        <div style="display:flex;justify-content:space-between;color:var(--text2);font-size:.8rem;margin-top:-12px;margin-bottom:16px">
          <span>Smaller</span><span id="qualityVal">90%</span><span>Better</span>
        </div>
      </div>

      <div id="status" class="status" style="display:none"></div>

      <div id="resultArea" style="display:none;margin-top:16px">
        <div id="resultInfo" style="color:var(--text2);margin-bottom:12px;font-size:.9rem"></div>
        <img id="resultPreview" style="max-width:100%;border-radius:8px;border:1px solid var(--border)">
      </div>

      <div id="actionRow" style="display:none;margin-top:20px">
        <button class="btn" id="convertBtn">Convert</button>
        <button class="btn btn-secondary" id="downloadBtn" style="display:none">Download</button>
        <button class="btn btn-secondary" id="resetBtn">Reset</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var dropZone = document.getElementById('dropZone');
  var fileInput = document.getElementById('fileInput');
  var previewArea = document.getElementById('previewArea');
  var imagePreview = document.getElementById('imagePreview');
  var controls = document.getElementById('controls');
  var actionRow = document.getElementById('actionRow');
  var convertBtn = document.getElementById('convertBtn');
  var downloadBtn = document.getElementById('downloadBtn');
  var resetBtn = document.getElementById('resetBtn');
  var statusEl = document.getElementById('status');
  var fileInfo = document.getElementById('fileInfo');
  var formatSelect = document.getElementById('format');
  var qualitySlider = document.getElementById('quality');
  var qualityVal = document.getElementById('qualityVal');
  var resultArea = document.getElementById('resultArea');
  var resultInfo = document.getElementById('resultInfo');
  var resultPreview = document.getElementById('resultPreview');

  var currentFile = null;
  var resultBlob = null;

  // Click to open file picker
  dropZone.addEventListener('click', function() {
    fileInput.click();
  });

  // File input change
  fileInput.addEventListener('change', function(e) {
    if (e.target.files && e.target.files[0]) {
      handleFile(e.target.files[0]);
    }
  });

  // Drag and drop
  dropZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', function(e) {
    e.preventDefault();
    dropZone.classList.remove('dragover');
  });

  dropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      handleFile(e.dataTransfer.files[0]);
    }
  });

  // Quality slider
  qualitySlider.addEventListener('input', function() {
    qualityVal.textContent = qualitySlider.value + '%';
  });

  function handleFile(file) {
    if (!file.type.startsWith('image/')) {
      alert('Please select an image file.');
      return;
    }
    currentFile = file;
    imagePreview.src = URL.createObjectURL(file);
    previewArea.style.display = 'block';
    controls.style.display = 'block';
    actionRow.style.display = 'flex';
    dropZone.style.display = 'none';
    statusEl.style.display = 'none';
    resultArea.style.display = 'none';
    downloadBtn.style.display = 'none';
    fileInfo.textContent = 'File: ' + file.name + ' (' + formatSize(file.size) + ')';
  }

  resetBtn.addEventListener('click', function() {
    currentFile = null;
    resultBlob = null;
    dropZone.style.display = 'block';
    previewArea.style.display = 'none';
    controls.style.display = 'none';
    actionRow.style.display = 'none';
    statusEl.style.display = 'none';
    resultArea.style.display = 'none';
    downloadBtn.style.display = 'none';
    imagePreview.src = '';
    fileInput.value = '';
  });

  convertBtn.addEventListener('click', function() {
    if (!currentFile) return;
    convertBtn.disabled = true;
    showStatus('Converting...', '');

    var img = new Image();
    img.onload = function() {
      var c = document.createElement('canvas');
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      var ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);

      var outputType = formatSelect.value;
      var quality = parseInt(qualitySlider.value) / 100;

      c.toBlob(function(blob) {
        resultBlob = blob;
        resultPreview.src = URL.createObjectURL(blob);
        var ext = outputType.split('/')[1];
        resultInfo.textContent = formatSize(currentFile.size) + ' → ' + formatSize(blob.size) + ' (' + ext.toUpperCase() + ', ' + img.naturalWidth + 'x' + img.naturalHeight + ')';
        resultArea.style.display = 'block';
        downloadBtn.style.display = 'inline-block';
        showStatus('Done!', 'done');
        convertBtn.disabled = false;
      }, outputType, quality);
    };
    img.src = currentFile;
  });

  downloadBtn.addEventListener('click', function() {
    if (!resultBlob || !currentFile) return;
    var ext = formatSelect.value.split('/')[1];
    downloadFile(resultBlob, currentFile.name.replace(/\.[^.]+$/, '.' + ext));
  });

  function formatSize(bytes) {
    if (bytes === 0) return '0 B';
    var k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
    var i = Math.floor(Math.log(bytes) / Math.log(k));
    return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
  }

  function downloadFile(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  }

  function showStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'status ' + (type || '');
    statusEl.style.display = 'block';
  }
})();
</script>
</body>
</html>
