<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Converter | Free, Private, Client-Side</title>
  <meta name="description" content="Free audio converter. WAV, WebM, OGG. Sample rate, channels, trim, fade. Batch mode. All in your browser.">
  <link rel="stylesheet" href="../../assets/style.css">
  <style>
    .waveform-wrap{width:100%;height:80px;background:var(--bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:12px 0}
    .waveform-canvas{display:block;width:100%;height:100%}
    .format-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:16px}
    .format-card{padding:12px;background:var(--bg);border:2px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;transition:.15s}
    .format-card:hover{border-color:var(--accent)}
    .format-card.active{border-color:var(--accent);background:rgba(34,197,94,.1)}
    .format-card .fmt-name{font-weight:700;color:var(--accent);font-size:1rem}
    .format-card .fmt-desc{font-size:.7rem;color:var(--text2);margin-top:4px}
    .setting-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .setting-row label{min-width:100px;font-size:.85rem;color:var(--text2)}
    .setting-row select,.setting-row input[type=range]{flex:1}
    .setting-row .val{min-width:50px;text-align:center;font-weight:600;color:var(--accent);font-size:.85rem}
    .time-row{display:flex;gap:8px;margin-bottom:12px}
    .time-row>div{flex:1}
    .time-row label{display:block;margin-bottom:4px;font-size:.8rem;color:var(--text2)}
    .time-row input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:6px;border-radius:4px}
    .preview-tabs{display:flex;gap:4px;margin-bottom:16px}
    .preview-tabs button{flex:1;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;font-size:.85rem;transition:.15s}
    .preview-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .preview-tabs button:hover:not(.active){border-color:var(--accent)}
    .batch-list{display:flex;flex-direction:column;gap:6px;margin:12px 0}
    .batch-item{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.85rem}
    .batch-item .batch-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .batch-item .batch-size{color:var(--text2);min-width:60px;text-align:right}
    .batch-item .batch-status{color:#22c55e;font-weight:600;min-width:60px;text-align:right}
    .batch-item .batch-remove{cursor:pointer;color:var(--red);padding:2px}
    .stat-row{display:flex;gap:8px;margin:12px 0}
    .stat-box{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
    .stat-box .stat-val{font-size:1.1rem;font-weight:700;color:var(--accent)}
    .stat-box .stat-label{font-size:.7rem;color:var(--text2);margin-top:4px}
    select,input[type=number]{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:8px}
  </style>
</head>
<body>
<div class="container">
  <div class="tool-page">
    <a href="../../" class="back-link">← Back to Tools</a>
    <h1>Audio Converter</h1>
    <p class="subtitle">Convert audio formats. WAV, WebM, OGG. Trim, fade, batch. All in your browser.</p>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="convert">Convert</button>
      <button class="tab" data-tab="batch">Batch</button>
      <button class="tab" data-tab="preview">Preview</button>
    </div>

    <div class="tool-area">
      <div class="upload-zone" id="dropZone">
        <div class="big-icon">📁</div>
        <strong>Drop audio file(s) here</strong>
        <p>or click to browse (MP3, WAV, OGG, M4A)</p>
        <input type="file" id="fileInput" accept="audio/*" multiple>
      </div>

      <div class="batch-list" id="batchList"></div>

      <div id="convertSection" style="display:none">
        <div class="preview-area">
          <audio id="audioPreview" controls style="width:100%"></audio>
          <div id="fileInfo" style="color:var(--text2);margin:12px 0;font-size:.9rem"></div>
        </div>

        <div class="waveform-wrap">
          <canvas class="waveform-canvas" id="waveformCanvas"></canvas>
        </div>

        <div class="preview-tabs" id="modeTabs">
          <button class="active" data-mode="format">Format</button>
          <button data-mode="trim">Trim</button>
          <button data-mode="fade">Fade</button>
        </div>

        <div id="formatMode">
          <label style="font-size:.85rem;color:var(--text2);margin-bottom:8px;display:block">Output Format</label>
          <div class="format-grid" id="formatGrid">
            <div class="format-card active" data-format="wav">
              <div class="fmt-name">WAV</div>
              <div class="fmt-desc">Uncompressed</div>
            </div>
            <div class="format-card" data-format="webm">
              <div class="fmt-name">WebM</div>
              <div class="fmt-desc">Compressed</div>
            </div>
            <div class="format-card" data-format="ogg">
              <div class="fmt-name">OGG</div>
              <div class="fmt-desc">Open format</div>
            </div>
          </div>

          <div class="setting-row">
            <label>Sample Rate</label>
            <select id="sampleRate">
              <option value="44100" selected>44100 Hz (CD)</option>
              <option value="48000">48000 Hz (DVD)</option>
              <option value="22050">22050 Hz (Low)</option>
            </select>
          </div>

          <div class="setting-row">
            <label>Channels</label>
            <select id="channels">
              <option value="2" selected>Stereo</option>
              <option value="1">Mono</option>
            </select>
          </div>
        </div>

        <div id="trimMode" style="display:none">
          <div class="time-row">
            <div>
              <label>Start (sec)</label>
              <input type="number" id="trimStart" value="0" min="0" step="0.1">
            </div>
            <div>
              <label>End (sec)</label>
              <input type="number" id="trimEnd" value="0" min="0" step="0.1">
            </div>
          </div>
          <div style="display:flex;gap:8px;margin-bottom:12px">
            <button class="btn btn-secondary" id="setTrimStartBtn" style="flex:1">Set Start = Now</button>
            <button class="btn btn-secondary" id="setTrimEndBtn" style="flex:1">Set End = Now</button>
          </div>
        </div>

        <div id="fadeMode" style="display:none">
          <div class="time-row">
            <div>
              <label>Fade In (sec)</label>
              <input type="number" id="fadeIn" value="0" min="0" step="0.1">
            </div>
            <div>
              <label>Fade Out (sec)</label>
              <input type="number" id="fadeOut" value="0" min="0" step="0.1">
            </div>
          </div>
        </div>

        <div class="stat-row" id="statRow" style="display:none">
          <div class="stat-box"><div class="stat-val" id="statFormat">-</div><div class="stat-label">Format</div></div>
          <div class="stat-box"><div class="stat-val" id="statDuration">-</div><div class="stat-label">Duration</div></div>
          <div class="stat-box"><div class="stat-val" id="statSize">-</div><div class="stat-label">Est. Size</div></div>
        </div>

        <div class="action-row">
          <button class="btn" id="convertBtn">Convert</button>
          <button class="btn btn-secondary" id="resetBtn">Reset</button>
        </div>
      </div>

      <div class="progress-bar" id="progressBar" style="display:none"><div class="fill" id="progressFill"></div></div>
      <div class="status" id="status"></div>
    </div>
  </div>
</div>
<script src="../../assets/tools.js"></script>
<script>
(function(){
  var dropZone=document.getElementById('dropZone');
  var fileInput=document.getElementById('fileInput');
  var convertSection=document.getElementById('convertSection');
  var audioPreview=document.getElementById('audioPreview');
  var convertBtn=document.getElementById('convertBtn');
  var resetBtn=document.getElementById('resetBtn');
  var statusEl=document.getElementById('status');
  var fileInfo=document.getElementById('fileInfo');
  var progressBar=document.getElementById('progressBar');
  var progressFill=document.getElementById('progressFill');
  var waveformCanvas=document.getElementById('waveformCanvas');
  var batchList=document.getElementById('batchList');
  var modeTabs=document.getElementById('modeTabs');
  var formatMode=document.getElementById('formatMode');
  var trimMode=document.getElementById('trimMode');
  var fadeMode=document.getElementById('fadeMode');
  var formatGrid=document.getElementById('formatGrid');
  var trimStart=document.getElementById('trimStart');
  var trimEnd=document.getElementById('trimEnd');

  var currentFile=null;
  var files=[];
  var results=[];
  var selectedFormat='wav';

  Tools.setupDropZone(dropZone,function(f){addFile(f)});
  fileInput.addEventListener('change',function(e){for(var i=0;i<e.target.files.length;i++)addFile(e.target.files[i]);});

  modeTabs.addEventListener('click',function(e){
    var btn=e.target.closest('button');if(!btn)return;
    modeTabs.querySelectorAll('button').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    var m=btn.dataset.mode;
    formatMode.style.display=m==='format'?'block':'none';
    trimMode.style.display=m==='trim'?'block':'none';
    fadeMode.style.display=m==='fade'?'block':'none';
  });

  formatGrid.addEventListener('click',function(e){
    var card=e.target.closest('.format-card');if(!card)return;
    formatGrid.querySelectorAll('.format-card').forEach(function(c){c.classList.remove('active');});
    card.classList.add('active');
    selectedFormat=card.dataset.format;
    updateStats();
  });

  function addFile(f){
    if(!f||!f.type.startsWith('audio/'))return;
    files.push(f);
    renderBatchList();
    if(files.length===1)loadFile(f);
  }

  function renderBatchList(){
    batchList.innerHTML='';
    if(files.length<=1){batchList.style.display='none';return;}
    batchList.style.display='block';
    files.forEach(function(f,i){
      var r=results[i];
      var item=document.createElement('div');
      item.className='batch-item';
      item.innerHTML='<span class="batch-name">'+f.name+'</span>'+
        '<span class="batch-size">'+Tools.formatSize(f.size)+'</span>'+
        (r?'<span class="batch-status">'+Tools.formatSize(r.size)+'</span>':'<span class="batch-status">-</span>')+
        '<span class="batch-remove" data-idx="'+i+'">✕</span>';
      batchList.appendChild(item);
    });
    batchList.querySelectorAll('.batch-remove').forEach(function(btn){
      btn.addEventListener('click',function(){
        var idx=parseInt(this.dataset.idx);
        files.splice(idx,1);results.splice(idx,1);
        renderBatchList();
        if(files.length===0)resetAll();
        else if(idx===0&&files.length>0)loadFile(files[0]);
      });
    });
  }

  async function loadFile(f){
    try{
      currentFile=f;
      convertSection.style.display='block';
      dropZone.style.display='none';
      audioPreview.src=URL.createObjectURL(f);
      fileInfo.textContent='File: '+f.name+' ('+Tools.formatSize(f.size)+')';
      audioPreview.onloadedmetadata=function(){
        trimEnd.value=audioPreview.duration.toFixed(1);
        updateStats();
        drawWaveform();
      };
    }catch(e){Tools.setStatus(statusEl,'Error: '+e.message,'error');}
  }

  async function drawWaveform(){
    var canvas=waveformCanvas;
    var ctx=canvas.getContext('2d');
    var w=canvas.parentElement.clientWidth;
    var h=canvas.parentElement.clientHeight;
    canvas.width=w*2;canvas.height=h*2;
    ctx.scale(2,2);
    ctx.clearRect(0,0,w,h);

    try{
      var audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      var resp=await fetch(audioPreview.src);
      var blob=await resp.blob();
      var arrayBuffer=await blob.arrayBuffer();
      var audioBuffer=await audioCtx.decodeAudioData(arrayBuffer);
      var data=audioBuffer.getChannelData(0);
      var step=Math.floor(data.length/w);
      var mid=h/2;

      for(var i=0;i<w;i++){
        var s=i*step;
        var min=1,max=-1;
        for(var j=0;j<step;j++){
          var v=data[s+j]||0;
          if(v<min)min=v;if(v>max)max=v;
        }
        ctx.fillStyle='rgba(34,197,94,.5)';
        ctx.fillRect(i,mid+max*mid,1,(mid+min*mid)-(mid+max*mid)||1);
      }
      ctx.strokeStyle='#22c55e';
      ctx.lineWidth=0.5;
      ctx.stroke();
      audioCtx.close();
    }catch(e){}
  }

  function updateStats(){
    var dur=audioPreview.duration||0;
    document.getElementById('statFormat').textContent=selectedFormat.toUpperCase();
    document.getElementById('statDuration').textContent=dur.toFixed(1)+'s';
    var bitrate=selectedFormat==='wav'?1411000:128000;
    document.getElementById('statSize').textContent=Tools.formatSize(bitrate*dur/8);
    document.getElementById('statRow').style.display='grid';
  }

  document.getElementById('setTrimStartBtn').addEventListener('click',function(){
    trimStart.value=audioPreview.currentTime.toFixed(1);
  });
  document.getElementById('setTrimEndBtn').addEventListener('click',function(){
    trimEnd.value=audioPreview.currentTime.toFixed(1);
  });

  convertBtn.addEventListener('click',async function(){
    if(!currentFile)return;
    convertBtn.disabled=true;
    progressBar.style.display='block';
    Tools.setStatus(statusEl,'Converting...','');
    progressFill.style.width='10%';

    try{
      var audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      var arrayBuffer=await Tools.readAsArrayBuffer(currentFile);
      var audioBuffer=await audioCtx.decodeAudioData(arrayBuffer);

      var start=parseFloat(trimStart.value)||0;
      var end=parseFloat(trimEnd.value)||audioBuffer.duration;
      if(end<=start)end=audioBuffer.duration;
      var fadeInv=parseFloat(document.getElementById('fadeIn').value)||0;
      var fadeOutv=parseFloat(document.getElementById('fadeOut').value)||0;
      var sr=parseInt(document.getElementById('sampleRate').value)||44100;
      var ch=parseInt(document.getElementById('channels').value)||2;

      var startSample=Math.floor(start*audioBuffer.sampleRate);
      var endSample=Math.floor(end*audioBuffer.sampleRate);
      var newLength=endSample-startSample;
      var newBuffer=audioCtx.createBuffer(ch,newLength,sr);
      var ratio=audioBuffer.sampleRate/sr;

      for(var c=0;c<ch;c++){
        var oldData=audioBuffer.getChannelData(Math.min(c,audioBuffer.numberOfChannels-1));
        var newData=newBuffer.getChannelData(c);
        for(var i=0;i<newLength;i++){
          var srcIdx=Math.floor((startSample+i)*ratio);
          newData[i]=oldData[srcIdx]||0;
        }
      }

      progressFill.style.width='40%';

      if(fadeInv>0||fadeOutv>0){
        var fadeSamples=Math.floor(fadeInv*sr);
        var fadeOutSamples=Math.floor(fadeOutv*sr);
        for(var c=0;c<ch;c++){
          var d=newBuffer.getChannelData(c);
          for(var i=0;i<fadeSamples&&i<d.length;i++)d[i]*=i/fadeSamples;
          for(var i=0;i<fadeOutSamples&&i<d.length;i++)d[d.length-1-i]*=i/fadeOutSamples;
        }
      }

      var offlineCtx=new OfflineAudioContext(ch,newLength,sr);
      var source=offlineCtx.createBufferSource();
      source.buffer=newBuffer;
      source.connect(offlineCtx.destination);
      source.start(0);
      var rendered=await offlineCtx.startRendering();

      progressFill.style.width='70%';

      var mimeMap={wav:'audio/wav',webm:'audio/webm',ogg:'audio/ogg'};
      var mimeType=mimeMap[selectedFormat]||'audio/wav';
      if(!MediaRecorder.isTypeSupported(mimeType))mimeType='audio/wav';

      var offCanvas=document.createElement('canvas');
      offCanvas.width=1;offCanvas.height=1;
      var stream=offCanvas.captureStream(0);
      var audioDest=audioCtx.createMediaStreamDestination();
      var src=audioCtx.createBufferSource();
      src.buffer=rendered;
      src.connect(audioDest);
      stream.addTrack(audioDest.stream.getAudioTracks()[0]);

      var chunks=[];
      var recorder=new MediaRecorder(stream,{mimeType:mimeType});
      recorder.ondataavailable=function(e){if(e.data.size>0)chunks.push(e.data);};

      var finalBlob=await new Promise(function(resolve){
        recorder.onstop=function(){resolve(new Blob(chunks,{type:mimeType}));};
        src.start(0);recorder.start();
        src.onended=function(){recorder.stop();};
      });

      var name=currentFile.name.replace(/\.[^.]+$/,'.'+selectedFormat);
      Tools.downloadBlob(finalBlob,name);
      Tools.setStatus(statusEl,'Done! '+Tools.formatSize(finalBlob.size),'done');
      progressFill.style.width='100%';
      audioCtx.close();
    }catch(e){
      Tools.setStatus(statusEl,'Error: '+e.message,'error');
    }
    convertBtn.disabled=false;
  });

  function resetAll(){
    currentFile=null;files=[];results=[];
    convertSection.style.display='none';
    dropZone.style.display='block';
    statusEl.style.display='none';
    progressBar.style.display='none';
    document.getElementById('statRow').style.display='none';
    audioPreview.src='';fileInput.value='';
    batchList.innerHTML='';
  }
  resetBtn.addEventListener('click',resetAll);
})();
</script>
</body>
</html>
