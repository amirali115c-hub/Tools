<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Tools | Free, Private, Client-Side</title>
  <meta name="description" content="Free PDF tools: compress PDFs and extract pages as images. No uploads, no tracking. Everything runs in your browser.">
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>

<div class="container">
  <div class="tool-page">
    <a href="../../" class="back-link">← Back to Tools</a>
    <h1>PDF Tools</h1>
    <p class="subtitle">Compress and extract PDF pages. Everything stays in your browser.</p>

    <div class="tool-area">
      <div class="upload-zone" id="dropZone">
        <div class="big-icon">📁</div>
        <strong>Drop a PDF here</strong>
        <p>or click to browse</p>
        <input type="file" id="fileInput" accept=".pdf,application/pdf">
      </div>

      <div class="preview-area" id="previewArea">
        <div id="fileInfo" style="color:var(--text2);margin-bottom:16px;font-size:.9rem"></div>
        <div id="pagePreviews" style="display:flex;flex-wrap:wrap;gap:12px"></div>
      </div>

      <div class="controls" id="controls">
        <label>Action</label>
        <select id="action">
          <option value="toImages">Extract pages as images</option>
          <option value="compress">Reduce file size</option>
        </select>

        <div id="extractOptions">
          <label>Output format</label>
          <select id="imgFormat">
            <option value="png">PNG</option>
            <option value="jpeg" selected>JPEG</option>
          </select>
          <label>Scale (resolution multiplier)</label>
          <select id="scale">
            <option value="1">1x (fast, smaller files)</option>
            <option value="1.5" selected>1.5x (balanced)</option>
            <option value="2">2x (high quality)</option>
          </select>
        </div>

        <div id="compressOptions" style="display:none">
          <label>Output quality</label>
          <select id="pdfQuality">
            <option value="0.5">Low (smallest)</option>
            <option value="0.7" selected>Medium</option>
            <option value="0.9">High</option>
          </select>
        </div>
      </div>

      <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
      <div class="status" id="status"></div>

      <div class="action-row" id="actionRow" style="display:none">
        <button class="btn" id="processBtn">Process PDF</button>
        <button class="btn btn-secondary" id="downloadBtn" style="display:none">Download All</button>
        <button class="btn btn-secondary" id="resetBtn">Reset</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="../../assets/tools.js"></script>
<script>
(function(){
  if (typeof pdfjsLib === 'undefined') {
    Tools.setStatus(document.getElementById('status'), 'Error: PDF library not loaded. Check your internet connection.', 'error');
    return;
  }

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  var dropZone = document.getElementById('dropZone');
  var fileInput = document.getElementById('fileInput');
  var previewArea = document.getElementById('previewArea');
  var controls = document.getElementById('controls');
  var actionRow = document.getElementById('actionRow');
  var processBtn = document.getElementById('processBtn');
  var downloadBtn = document.getElementById('downloadBtn');
  var resetBtn = document.getElementById('resetBtn');
  var statusEl = document.getElementById('status');
  var fileInfo = document.getElementById('fileInfo');
  var pagePreviews = document.getElementById('pagePreviews');
  var extractOptions = document.getElementById('extractOptions');
  var compressOptions = document.getElementById('compressOptions');
  var progressBar = document.getElementById('progressBar');
  var progressFill = document.getElementById('progressFill');
  var actionSelect = document.getElementById('action');

  var currentFile = null;
  var pdfDoc = null;
  var resultBlobs = [];

  Tools.setupDropZone(dropZone, handleFile);
  fileInput.addEventListener('change', function(e) { if (e.target.files[0]) handleFile(e.target.files[0]); });

  actionSelect.addEventListener('change', function() {
    extractOptions.style.display = actionSelect.value === 'toImages' ? 'block' : 'none';
    compressOptions.style.display = actionSelect.value === 'compress' ? 'block' : 'none';
  });

  async function handleFile(file) {
    currentFile = file;
    dropZone.style.display = 'none';
    previewArea.style.display = 'block';
    controls.style.display = 'block';
    actionRow.style.display = 'flex';
    statusEl.style.display = 'none';
    downloadBtn.style.display = 'none';
    progressBar.style.display = 'none';
    fileInfo.textContent = 'File: ' + file.name + ' (' + Tools.formatSize(file.size) + ')';

    Tools.setStatus(statusEl, 'Loading PDF...', '');

    try {
      var data = await Tools.readAsArrayBuffer(file);
      pdfDoc = await pdfjsLib.getDocument({ data: data }).promise;
      var pages = pdfDoc.numPages;

      pagePreviews.innerHTML = '';
      var renderLimit = Math.min(pages, 6);

      for (var i = 1; i <= renderLimit; i++) {
        var page = await pdfDoc.getPage(i);
        var viewport = page.getViewport({ scale: 0.3 });
        var canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.borderRadius = '6px';
        canvas.style.border = '1px solid var(--border)';
        canvas.style.maxWidth = '200px';
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
        pagePreviews.appendChild(canvas);
      }

      if (pages > renderLimit) {
        var more = document.createElement('div');
        more.style.cssText = 'display:flex;align-items:center;color:var(--text2);font-size:.9rem';
        more.textContent = '+ ' + (pages - renderLimit) + ' more pages';
        pagePreviews.appendChild(more);
      }

      Tools.setStatus(statusEl, 'PDF loaded: ' + pages + ' page' + (pages > 1 ? 's' : ''), 'done');
    } catch(err) {
      Tools.setStatus(statusEl, 'Error loading PDF: ' + err.message, 'error');
    }
  }

  resetBtn.addEventListener('click', function() {
    currentFile = null;
    pdfDoc = null;
    resultBlobs = [];
    dropZone.style.display = 'block';
    previewArea.style.display = 'none';
    controls.style.display = 'none';
    actionRow.style.display = 'none';
    statusEl.style.display = 'none';
    progressBar.style.display = 'none';
    downloadBtn.style.display = 'none';
    fileInput.value = '';
  });

  processBtn.addEventListener('click', async function() {
    if (!pdfDoc) return;
    processBtn.disabled = true;
    progressBar.style.display = 'block';
    resultBlobs = [];

    if (actionSelect.value === 'toImages') {
      await extractImages();
    } else {
      await compressPDF();
    }
    processBtn.disabled = false;
  });

  async function extractImages() {
    var format = document.getElementById('imgFormat').value;
    var scale = parseFloat(document.getElementById('scale').value);
    var pages = pdfDoc.numPages;

    Tools.setStatus(statusEl, 'Extracting pages...', '');

    for (var i = 1; i <= pages; i++) {
      var page = await pdfDoc.getPage(i);
      var viewport = page.getViewport({ scale: scale });
      var canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;

      var mimeType = format === 'jpeg' ? 'image/jpeg' : 'image/png';
      var quality = format === 'jpeg' ? 0.92 : undefined;

      var blob = await new Promise(function(resolve) {
        canvas.toBlob(resolve, mimeType, quality);
      });
      resultBlobs.push({ blob: blob, name: 'page_' + i + '.' + format });

      var pct = Math.floor((i / pages) * 100);
      progressFill.style.width = pct + '%';
      Tools.setStatus(statusEl, 'Extracted page ' + i + '/' + pages, '');
    }

    Tools.setStatus(statusEl, 'Done! ' + pages + ' pages extracted.', 'done');
    progressFill.style.width = '100%';
    downloadBtn.style.display = 'inline-block';
  }

  async function compressPDF() {
    Tools.setStatus(statusEl, 'Reducing image quality across all pages...', '');
    var pages = pdfDoc.numPages;
    var quality = parseFloat(document.getElementById('pdfQuality').value);

    for (var i = 1; i <= pages; i++) {
      var page = await pdfDoc.getPage(i);
      var viewport = page.getViewport({ scale: 1.5 });
      var canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;

      var blob = await new Promise(function(resolve) {
        canvas.toBlob(resolve, 'image/jpeg', quality);
      });
      resultBlobs.push({ blob: blob, name: 'compressed_page_' + i + '.jpg' });

      var pct = Math.floor((i / pages) * 100);
      progressFill.style.width = pct + '%';
    }

    Tools.setStatus(statusEl, 'Done! ' + pages + ' compressed images ready.', 'done');
    progressFill.style.width = '100%';
    downloadBtn.style.display = 'inline-block';
  }

  downloadBtn.addEventListener('click', function() {
    resultBlobs.forEach(function(item, i) {
      setTimeout(function() {
        Tools.downloadBlob(item.blob, item.name);
      }, i * 300);
    });
  });
})();
</script>

</body>
</html>
